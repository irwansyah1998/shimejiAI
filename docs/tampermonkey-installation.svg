<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Shimeji AI Assistant installation flow</title>
  <desc id="desc">Four professional installation steps: install Tampermonkey, create the userscript, configure an AI provider, and run the assistant.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef8f4"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17324d"/>
      <stop offset="1" stop-color="#285f68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8aa2ae"/>
    </marker>
    <style>
      .title { font: 700 31px Arial, sans-serif; fill: #ffffff; letter-spacing: .3px; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #d8e9ed; }
      .step { font: 700 19px Arial, sans-serif; fill: #17324d; }
      .body { font: 400 15px Arial, sans-serif; fill: #4b6673; }
      .label { font: 700 12px Arial, sans-serif; fill: #5e7883; letter-spacing: 1px; }
      .number { font: 700 23px Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#background)"/>
  <rect x="32" y="28" width="1216" height="122" rx="20" fill="url(#header)"/>
  <circle cx="91" cy="89" r="30" fill="#61c985"/>
  <circle cx="81" cy="84" r="5" fill="#ffffff"/><circle cx="101" cy="84" r="5" fill="#ffffff"/>
  <path d="M82 101Q91 108 100 101" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="140" y="82" class="title">Install Shimeji AI Assistant</text>
  <text x="140" y="111" class="subtitle">A four-step setup for the Tampermonkey browser extension</text>

  <path d="M292 315H326M594 315H628M896 315H930" fill="none" stroke="#8aa2ae" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="48" y="190" width="260" height="250" rx="18" fill="#ffffff"/>
    <rect x="48" y="190" width="260" height="8" rx="4" fill="#4a90e2"/>
    <circle cx="88" cy="245" r="24" fill="#4a90e2"/><text x="88" y="253" text-anchor="middle" class="number">1</text>
    <text x="128" y="241" class="label">STEP ONE</text><text x="128" y="268" class="step">Install</text>
    <text x="76" y="318" class="body">Install Tampermonkey</text><text x="76" y="342" class="body">in your browser and</text><text x="76" y="366" class="body">open its dashboard.</text>
    <rect x="76" y="394" width="150" height="24" rx="12" fill="#edf5ff"/><text x="151" y="411" text-anchor="middle" class="label">BROWSER EXTENSION</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="190" width="260" height="250" rx="18" fill="#ffffff"/>
    <rect x="350" y="190" width="260" height="8" rx="4" fill="#61c985"/>
    <circle cx="390" cy="245" r="24" fill="#61c985"/><text x="390" y="253" text-anchor="middle" class="number">2</text>
    <text x="430" y="241" class="label">STEP TWO</text><text x="430" y="268" class="step">Create script</text>
    <text x="378" y="318" class="body">Choose “Create a new</text><text x="378" y="342" class="body">script” and paste the</text><text x="378" y="366" class="body">complete userscript.</text>
    <rect x="378" y="394" width="174" height="24" rx="12" fill="#edf9f1"/><text x="465" y="411" text-anchor="middle" class="label">SHIMEJI-AI.USER.JS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="652" y="190" width="260" height="250" rx="18" fill="#ffffff"/>
    <rect x="652" y="190" width="260" height="8" rx="4" fill="#f0a44b"/>
    <circle cx="692" cy="245" r="24" fill="#f0a44b"/><text x="692" y="253" text-anchor="middle" class="number">3</text>
    <text x="732" y="241" class="label">STEP THREE</text><text x="732" y="268" class="step">Configure</text>
    <text x="680" y="318" class="body">Choose OpenAI or Gemini</text><text x="680" y="342" class="body">and set the provider key</text><text x="680" y="366" class="body">inside the CONFIG object.</text>
    <rect x="680" y="394" width="142" height="24" rx="12" fill="#fff5e8"/><text x="751" y="411" text-anchor="middle" class="label">API SETTINGS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="954" y="190" width="260" height="250" rx="18" fill="#ffffff"/>
    <rect x="954" y="190" width="260" height="8" rx="4" fill="#907def"/>
    <circle cx="994" cy="245" r="24" fill="#907def"/><text x="994" y="253" text-anchor="middle" class="number">4</text>
    <text x="1034" y="241" class="label">STEP FOUR</text><text x="1034" y="268" class="step">Run</text>
    <text x="982" y="318" class="body">Save and enable the</text><text x="982" y="342" class="body">userscript, then reload</text><text x="982" y="366" class="body">a webpage and double-click.</text>
    <rect x="982" y="394" width="136" height="24" rx="12" fill="#f1efff"/><text x="1050" y="411" text-anchor="middle" class="label">READY TO USE</text>
  </g>

  <text x="640" y="505" text-anchor="middle" class="body">Tip: keep your API key private and use a backend proxy for production deployments.</text>
</svg>
